# The alpha profile: vanilla perf only, the default when neither -Dmcopt.profile nor config/mcopt.properties names a
# profile (profile=none turns it off). Far terrain (mcopt.lod) is NOT set: it stays an experimental opt-in.
# Thread QoS is the mod's default: not set here. A flag on the command line or in config/mcopt.properties wins.
# On the small tier (GPU under 10 cores, or 8 GB of RAM or less, or either unreadable) Profile leaves out the keys
# listed in Profile.SMALL_OUT (the 4096-entry section-clone cache and its cleanup: memory).

# Chunk pipeline: skip byte-identical region writes; mesher fast paths incl. biome blend (exact)
mcopt.chunk.saveSkip=true
mcopt.chunk.mesh=all,biome
# Sodium section-clone cache of 4096 with expired-entry cleanup (cleanup required next to clones=4096)
mcopt.chunk.clones=4096
mcopt.chunk.clonesCleanup=true
# Render-list walk with a region cache; cull recovery
mcopt.cpu.lists=true
mcopt.cpu.cullRecover=true
# Startup: narrator created lazily
mcopt.startup.narrator=lazy
# Light engine publishes a read-only snapshot of its section map instead of a copy per update (both tiers)
mcopt.alloc.lightMap=true
# Texel buffer views cached over the same memory (exact, 0 px); entity model compile reuse (exact by construction)
# (both tiers)
mcopt.cpu.texelCache=true
mcopt.cpu.model=true

# Far terrain's settings, inert unless far terrain is turned on (mcopt.lod=true in config/mcopt.properties): every far-terrain
# mixin applies only with mcopt.lod. The far set: the plain mesh with the full cull (lists and the
# real-terrain occluder stay opt-in), the seamless set, NEON noise with the yield policy. maskSpread is set on below.
mcopt.lod.render=mesh
mcopt.lod.fade=instant
mcopt.lod.handoff=drawn
mcopt.lod.prio=screen
mcopt.lod.publish=gpu
mcopt.lod.nativeNoise=neon
mcopt.lod.yield=missing:0
# Hand-off: far terrain's depth pushed back so real terrain wins coplanar tops, and the deep
# re-check spread over 64 frames under handoff=drawn (set here, so it is on whatever the built-in default)
mcopt.lod.handoffPush=0.9995
mcopt.lod.maskSpread=true
