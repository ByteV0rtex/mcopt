# The recommended profile: the measured, accepted wins. Turn it on with profile=recommended in
# <game dir>/config/mcopt.properties, or -Dmcopt.profile=recommended. A flag given on the command line or in that
# file wins over the value here. Every setting here was measured on the test Macs before it was accepted.

# Far terrain (reach: the code default, 512 chunks), mesh renderer, position-keyed lists with the load switch, the real terrain as an occluder
mcopt.lod=true
mcopt.lod.render=mesh
mcopt.lod.pk=true
mcopt.lod.pkSwitch=load
mcopt.lod.realOcc=true
# The seamless set: no fade-in, drawn hand-off, screen-priority streaming, GPU publish
mcopt.lod.fade=instant
mcopt.lod.handoff=drawn
mcopt.lod.prio=screen
mcopt.lod.publish=gpu
# Far terrain's noise on NEON, bit-exact with the game's
mcopt.lod.nativeNoise=neon
# Far-terrain generation yields while the client lacks chunks in its render distance (real chunks no later than with far
# terrain off: 0 holes on both rigs)
mcopt.lod.yield=missing:0
# Thread QoS (render interactive + server initiated) is the mod's default: not set here.
# Chunk pipeline: skip byte-identical region writes; the mesher's fast paths
mcopt.chunk.saveSkip=true
mcopt.chunk.mesh=all
# Sodium section-clone cache of 4096 (mesh + visibility digest identical, 0 stale over 437,933 verified hits)
mcopt.chunk.clones=4096
# Render-list walk with a region cache (-9% of readRenderListFromTree on the Neo)
mcopt.cpu.lists=true
